# Unified umbrella ingress for all services
# Change port numbers & path name recording to each service's config

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pacerly-ingress
  namespace: pacerly-app
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Required so large Keycloak OIDC cookies/JWT headers do not cause 502 Bad Gateway
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - group-4-m7011e-ltu.se
      secretName: group-4-m7011e-ltu-tls
  rules:
    - host: group-4-m7011e-ltu.se
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /activities
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: 8000
          - path: /shoes
            pathType: Prefix
            backend:
              service:
                name: equipment-service
                port:
                  number: 8000
          - path: /paces
            pathType: Prefix
            backend:
              service:
                name: adaptive-pacing-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80