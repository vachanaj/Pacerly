apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-service
  namespace: {{ .Values.namespace }}
  labels:
    app: activity-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: activity-service
  template:
    metadata:
      labels:
        app: activity-service
    spec:
      containers:
        - name: activity-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: KEYCLOAK_ISSUER_URL
              value: {{ .Values.keycloak.issuerUrl | quote }}
            - name: KEYCLOAK_INTERNAL_JWKS_URL
              value: {{ .Values.keycloak.internalJwksUrl | quote }}
          envFrom:
            - secretRef:
                name: activity-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}