apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    app: keycloak
spec:
  type: {{ .Values.service.type }}
  selector:
    app: keycloak
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management