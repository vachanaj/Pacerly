apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUser | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  KC_DB_USERNAME: {{ .Values.database.username | quote }}
  KC_DB_PASSWORD: {{ .Values.database.password | quote }}