apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-adaptive-pacing-service
  labels:
    app.kubernetes.io/name: adaptive-pacing-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: adaptive-pacing-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-pacing-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: adaptive-pacing-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: RABBITMQ_EXCHANGE
              value: {{ .Values.env.rabbitmqExchange | quote }}
            - name: RABBITMQ_QUEUE
              value: {{ .Values.env.rabbitmqQueue | quote }}
            - name: RABBITMQ_ROUTING_KEY
              value: {{ .Values.env.rabbitmqRoutingKey | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.corsOrigins | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-adaptive-pacing-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-adaptive-pacing-secret
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}