apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-adaptive-pacing-secret
  labels:
    app.kubernetes.io/name: adaptive-pacing-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  RABBITMQ_URL: {{ .Values.secrets.rabbitmqUrl | quote }}